name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Env info
        run: |
          sw_vers
          df -h /
          ls /Applications | grep -i xcode || true

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Free disk space
        run: |
          sudo rm -rf /Users/runner/Library/Developer/CoreSimulator/Caches/* 2>/dev/null || true
          df -h /

      - name: Generate project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          set -o pipefail
          xcodebuild -project STV.xcodeproj -scheme STV -resolvePackageDependencies 2>&1 | tail -50

      - name: Build (Release / unsigned / device)
        run: |
          set -o pipefail
          xcodebuild -project STV.xcodeproj -scheme STV \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedDataRelease \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -300

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=DerivedDataRelease/Build/Products/Release-iphoneos/STV.app
          ls -ld "$APP"
          VER=$(awk -F'"' '/MARKETING_VERSION/{print $2; exit}' project.yml)
          BUILD=$(awk -F'"' '/CURRENT_PROJECT_VERSION/{print $2; exit}' project.yml)
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          mkdir -p dist
          (cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/dist/STV-${VER}-${BUILD}-unsigned.ipa" Payload)
          rm -rf "$STAGE"
          du -sh dist/*
          shasum -a 256 dist/*.ipa | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STV-ipa-${{ matrix.os }}
          path: |
            dist/*.ipa
            dist/SHA256SUMS.txt
            build.log
          retention-days: 30
