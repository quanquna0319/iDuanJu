name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Env info
        run: |
          sw_vers
          df -h /
          ls /Applications | grep -i xcode || true

      # AetherEngine 7.62.0 uses iOS 26 SDK APIs (VTFrameProcessor /
      # VTLowLatencySuperResolutionScaler), so Xcode 16 cannot compile it.
      - name: Select newest Xcode (26+)
        run: |
          SEL=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_3*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$SEL" ]; then
            echo "::error::no Xcode 26+ image found"; ls /Applications; exit 1
          fi
          echo "SELECTED=$SEL" >> "$GITHUB_ENV"
          sudo xcode-select -s "$SEL"
          xcodebuild -version

      - name: Free disk space
        run: |
          for app in /Applications/Xcode*.app; do
            if [ "$app" != "$SELECTED" ]; then echo "removing $app"; sudo rm -rf "$app" || true; fi
          done
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* 2>/dev/null || true
          df -h /

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          xcodegen generate
          grep -n "deploymentTarget" -A2 project.yml || true

      - name: Resolve packages
        run: |
          set -o pipefail
          xcodebuild -project STV.xcodeproj -scheme STV -resolvePackageDependencies 2>&1 | tail -40
          df -h /

      - name: Build (Release / unsigned / device)
        run: |
          set -o pipefail
          xcodebuild -project STV.xcodeproj -scheme STV \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedDataRelease \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -300

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=DerivedDataRelease/Build/Products/Release-iphoneos/STV.app
          ls -ld "$APP"
          VER=$(awk -F'"' '/MARKETING_VERSION/{print $2; exit}' project.yml)
          BUILD=$(awk -F'"' '/CURRENT_PROJECT_VERSION/{print $2; exit}' project.yml)
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          mkdir -p dist
          (cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/dist/STV-${VER}-${BUILD}-unsigned.ipa" Payload)
          rm -rf "$STAGE"
          du -sh dist/*
          shasum -a 256 dist/*.ipa | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STV-ipa-${{ matrix.os }}
          path: |
            dist/*.ipa
            dist/SHA256SUMS.txt
            build.log
          retention-days: 30
